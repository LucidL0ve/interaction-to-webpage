<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox Assignment</title>
  <style>
    body {
      background-color: #FFF2BD;
    }
   
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="https://i.pinimg.com/736x/11/c3/eb/11c3eb5153193e9901596326f5a490a4.jpg" alt="wxs" width="40">
    </div>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="main">
    <div class="text">
      <h1>The Tenma Layout</h1>
      <p id="myDIV">Tsukasa Tenma at your service with some new webpage designs!</p>
      <button id="toggleImage">Toggle Image</button>
      <button id="changeTextButton">New Text?</button>
    </div>
    <div class="image">
      <section class="content">
        <img id="gallery" src="./assets/image1.jpg" alt="Images" />
      </section>
    </div>
  </section>

  <section class="cards">
    <div class="card">Card 1</div>
    <div class="card">Card 2</div>
    <div class="card">Card 3</div>
    <div class="card">Card 4</div>
    <div class="card">Card 5</div>
    <div class="card">Card 6</div>
  </section>

  <footer>
    <p>© My first flexbox layout.</p>
  </footer>

  <script src="script.js"></script>

</html>
